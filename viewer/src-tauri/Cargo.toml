[package]
name = "agent-switchboard"
version = "1.4.1"
description = "Agent Switchboard — live viewer for AI agent lanes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
hex = "0.4"
get_if_addrs = "0.5"

[profile.release]
strip = true
lto = true
